<div class="min-h-screen bg-gray-50 dark:bg-gray-900 py-8">
  <div class="max-w-6xl mx-auto px-4">
    <h1 class="text-3xl font-bold text-center mb-8 text-gray-800 dark:text-white">Mes Projets</h1>
    
    <div class="projects-grid">
      <div *ngFor="let project of projects" 
           class="project-card"
           [ngClass]="{
             'work-in-progress': project.status === 'work-in-progress',
             'completed': project.status === 'completed'
           }">
        
        <div class="project-header">
          <h3>{{ project.title }}</h3>
          <span *ngIf="project.status === 'work-in-progress'" 
                class="status-badge">
            Work in Progress
          </span>
        </div>
        
        <p>{{ project.description }}</p>
        
        <div class="tech-stack">
          <span *ngFor="let tech of project.technologies" 
                class="tech-tag">
            {{ tech }}
          </span>
        </div>
        
        <div class="project-actions" *ngIf="project.status === 'completed'">
          <a *ngIf="project.link" 
             [href]="project.link" 
             class="action-button primary">
            Voir le projet
          </a>
          <a *ngIf="project.github" 
             [href]="project.github" 
             target="_blank"
             class="action-button secondary">
            GitHub
          </a>
        </div>
        
        <div class="project-actions" *ngIf="project.status === 'work-in-progress'">
          <button class="action-button disabled" disabled>
            En développement...
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
