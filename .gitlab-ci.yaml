image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2

stages:
  - build
  - deploy

before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

build_angular_image:
  stage: build
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest ./frontend
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml
